name: Turso DB Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/turso-bootstrap.yml"
      - "scripts/**"
  workflow_dispatch:

jobs:
  bootstrap-db:
    name: Apply migrations, and seed Turso
    runs-on: ubuntu-latest

    env:
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          if [ -z "$TURSO_DB_URL" ]; then
            echo "TURSO_DB_URL is missing"
            exit 1
          fi

          if [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "TURSO_AUTH_TOKEN is missing"
            exit 1
          fi

          echo "Turso secrets are present"

      - name: Apply migrations
        run: node scripts/migrate.js

      - name: Seed database
        run: node scripts/seed.js